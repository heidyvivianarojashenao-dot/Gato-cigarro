name: Construir APK GATO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Descomprimir proyecto
        run: |
          mkdir gato_project
          unzip -q GATO_ANDROID_API36_GITHUB_WHATSAPP_DIRECTO.zip -d gato_project

      - name: Preparar proyecto GATO
        run: |
          cd gato_project/GATO_ANDROID

          mkdir -p app/src/main/res/drawable

          cp app/src/main/assets/icon-512.png app/src/main/res/drawable/icon_gato.png

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()

          s = s.replace(
              '<application',
              '<application\n        android:icon="@drawable/icon_gato"',
              1
          )

          p.write_text(s)
          PY

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Construir APK
        run: |
          cd gato_project/GATO_ANDROID
          gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: GATO-APK
          path: gato_project/GATO_ANDROID/app/build/outputs/apk/debug/app-debug.apk
